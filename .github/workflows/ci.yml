name: son

on:
  push:
    branches: ["son-lukas"]

permissions:
  contents: read
  pages: write 
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "20"
          cache: "maven"

      - name: Build + Test (generate JaCoCo)
        working-directory: ci-cd-pipeline/recipe-planner-fronend-and-backend/recipe-planner-backend
        run: mvn -B clean verify

      - name: Prepare Pages folder
        run: |
          rm -rf public
          mkdir -p public/jacoco
          cp -r ci-cd-pipeline/recipe-planner-fronend-and-backend/recipe-planner-backend/target/site/jacoco/* public/jacoco/
          cat > public/index.html <<'EOF'
          <!doctype html>
          <html>
            <head>
              <meta charset="utf-8"/>
              <meta http-equiv="refresh" content="0; url=./jacoco/index.html"/>
              <title>JaCoCo Report</title>
            </head>
            <body>
              <p>Redirecting to <a href="./jacoco/index.html">JaCoCo report</a>…</p>
            </body>
          </html>
          EOF


