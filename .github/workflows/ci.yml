name: Publish JaCoCo to Pages

on:
  push:
    branches: ["tah-dev"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "20"
          cache: "maven"

      # OPTIONAL aber extrem hilfreich zum Debuggen falls Pfad doch anders ist
      - name: Debug repo structure
        run: |
          pwd
          ls -la
          find . -maxdepth 4 -name pom.xml

      - name: Build + Test (generate JaCoCo)
        working-directory: ci-cd-pipeline/recipe-planner-fronend-and-backend/recipe-planner-backend
        run: mvn -B clean verify

      - name: Prepare Pages folder
        run: |
          rm -rf public
          mkdir -p public/jacoco
          cp -r ci-cd-pipeline/recipe-planner-fronend-and-backend/recipe-planner-backend/target/site/jacoco/* public/jacoco/

          cat > public/index.html <<'EOF'
          <!doctype html>
          <html>
            <head>
              <meta charset="utf-8"/>
              <meta http-equiv="refresh" content="0; url=./jacoco/index.html"/>
              <title>JaCoCo Report</title>
            </head>
            <body>
              <p>Redirecting to <a href="./jacoco/index.html">JaCoCo report</a>…</p>
            </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
